<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuestionario - Seguridad Informática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="quiz-wrapper">
    <!-- Vista del Cuestionario -->
    <div id="quiz-card" class="card">
      <div class="quiz-header">
        <span id="q-counter">Pregunta 1 de 30</span>
        <span id="score-counter">Aciertos: 0</span>
      </div>

      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <h2 id="question-text" class="question-text">Cargando pregunta...</h2>

      <div id="options-list" class="options-list"></div>

      <div id="explanation-box" class="explanation-box" style="display: none;"></div>

      <div class="quiz-footer">
        <button id="btn-next" class="btn" style="display: none;">Siguiente Pregunta</button>
      </div>
    </div>

    <!-- Vista de Resultados -->
    <div id="result-card" class="card result-card" style="display: none;">
      <h2>¡Cuestionario Completado!</h2>
      <div class="final-score" id="final-score">0 / 30</div>
      <p id="final-msg" class="final-msg"></p>
      <button id="btn-restart" class="btn">Reiniciar (30 Nuevas)</button>
    </div>
  </main>

  <script src="preguntas.js"></script>
  <script src="app.js"></script>
</body>
</html>
